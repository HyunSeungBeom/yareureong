name: CI/CD

# PR  → 검증만 (backend · frontend)
# main push → 검증 → 백엔드 이미지(GHCR) → API 배포(Render) → 웹 배포(Vercel)
# 배포 설정·비밀값·롤백은 DEPLOY.md

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hyunseungbeom/kbo-predictor-api
  VERCEL_CLI: vercel@59.20.0
  # 프로젝트를 소유한 팀. 토큰 범위가 애매하면 CLI 가 개인 계정에서 프로젝트를 찾다 실패한다
  VERCEL_SCOPE: seungbeoms-projects

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build & Test
        run: ./gradlew build --no-daemon

  frontend:
    name: Frontend · verify & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # type-check · test · lint
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

  image:
    name: Image · push to GHCR
    needs: [ backend, frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 테스트는 backend job 이 이미 돌렸다. 여기서는 같은 커밋을 이미지로 굳힌다.
      # 태그 = 커밋 SHA → 무엇이 떠 있는지 추적하고, 이전 SHA 로 롤백할 수 있다.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy · API (Render)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.API_URL }}/actuator/info
    concurrency:
      group: deploy-production-api
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check settings
        run: |
          missing=""
          [ -n "$API_URL" ] || missing="$missing vars.API_URL"
          [ -n "$RENDER_DEPLOY_HOOK_URL" ] || missing="$missing secrets.RENDER_DEPLOY_HOOK_URL"
          if [ -n "$missing" ]; then
            echo "::error::production 환경에 설정이 없다:$missing — DEPLOY.md 참고"
            exit 1
          fi

      - name: Trigger Render deploy (this commit's image)
        run: |
          curl -fsS -X POST --get "$RENDER_DEPLOY_HOOK_URL" \
            --data-urlencode "imgURL=$IMAGE:$GITHUB_SHA" > /dev/null
          echo "배포 요청: $IMAGE:$GITHUB_SHA"

      # 배포 훅은 요청만 받고 바로 돌아온다. «이 커밋이 실제로 떠서 응답하는가» 를 직접 확인한다.
      # 무료 인스턴스는 이미지 받기 + 기동에 몇 분 걸린다.
      - name: Wait until this commit is serving
        run: |
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            commit=$(curl -fsS --max-time 90 "$API_URL/actuator/info" | jq -r '.app.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "떠 있는 커밋 확인: $commit"
              break
            fi
            echo "대기 중 — 현재 ${commit:-응답 없음}"
            sleep 20
          done
          [ "$commit" = "$GITHUB_SHA" ] || { echo "::error::20분 안에 $GITHUB_SHA 가 뜨지 않았다 — Render 배포 로그 확인"; exit 1; }

      - name: Smoke · health, ingest source, data API
        run: |
          curl -fsS "$API_URL/actuator/health" | jq -e '.status == "UP"'
          # live 프로필이 빠지면 샘플 출처가 켜져 실제 결과를 가짜로 덮어쓴다 — 여기서 막는다
          curl -fsS "$API_URL/actuator/info" | jq -e '.ingestSource == "DaumKboScheduleSource"' \
            || { echo "::error::운영 수집 출처가 실데이터가 아니다 — Render 에 SPRING_PROFILES_ACTIVE=live 확인"; exit 1; }
          curl -fsS "$API_URL/api/standings" | jq -e 'type == "array"'

  deploy-web:
    name: Deploy · Web (Vercel)
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check settings
        run: |
          missing=""
          for name in API_URL WEB_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::production 환경에 설정이 없다:$missing — DEPLOY.md 참고"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 레포 루트에서 실행한다. Vercel 프로젝트의 Root Directory 가 web 으로 설정돼 있다.
      - name: Pull Vercel project settings
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
          # 프로젝트에 NEXT_PUBLIC_API_BASE 가 남아 있으면 빌드가 그 값을 API 주소로 박아
          # 프록시를 건너뛴다. 게다가 «민감값» 으로 등록돼 있으면 실제 값 대신 [SENSITIVE] 라는
          # 문자열이 내려와 /[SENSITIVE]/api/... 같은 주소를 부르게 된다(실제로 겪었다).
          # 이 배포에서는 항상 같은 사이트로 부르므로 그 값을 걷어낸다.
          sed -i '/^NEXT_PUBLIC_API_BASE=/d' .vercel/.env.production.local 2>/dev/null || true

      # NEXT_PUBLIC_* 는 빌드 시점에 번들에 박힌다 — 그래서 여기서 주입한다
      - name: Build
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
        env:
          # 브라우저는 같은 사이트(/api/*)로 부르고, 이 값은 그 요청을 넘길 실제 API 서버다
          API_PROXY_ORIGIN: ${{ vars.API_URL }}
          NEXT_PUBLIC_API_BASE: ""

      # 프론트는 API 를 **같은 사이트**(/api/*)로 부르고 Next 프록시가 실제 서버로 넘긴다.
      # 번들에 외부 API 주소가 박혀 있으면 프록시를 건너뛴 것이고, 그러면 세션 쿠키가 제3자
      # 쿠키가 되어 사파리·아이폰에서 로그인이 안 된다.
      - name: Check requests go through the same-site proxy
        run: |
          if grep -rqF "$API_URL" .vercel/output/static/_next; then
            echo "::error::번들에 외부 API 주소가 박혀 있다 — NEXT_PUBLIC_API_BASE 를 비우고 프록시를 쓰게 한다"
            exit 1
          fi
          if grep -rqF "[SENSITIVE]" .vercel/output/static/_next; then
            echo "::error::번들에 [SENSITIVE] 가 박혔다 — Vercel 의 민감값 환경변수가 API 주소 자리에 들어갔다"
            exit 1
          fi
          grep -q "$API_URL" .vercel/output/config.json || {
            echo "::error::프록시 설정이 빌드에 없다 — API_PROXY_ORIGIN 을 확인한다"; exit 1; }

      - name: Deploy
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      # 배포 직후에는 주소가 붙기까지 잠깐 걸린다(프로젝트 이름을 바꾼 직후엔 특히) — 넉넉히 기다린다
      - name: Smoke · pages
        run: |
          for path in / /schedule /board; do
            curl -fsS --retry 8 --retry-delay 15 --retry-all-errors --max-time 60 "$WEB_URL$path" \
              | grep -q "야구르지렁" \
              || { echo "::error::$WEB_URL$path 응답 이상"; exit 1; }
          done
